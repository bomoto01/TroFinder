# ==========================
# Server
# ==========================
server.port=8080

# ==========================
# Database
# ==========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trofinder?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================
# Encoding
# ==========================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ==========================
# JWT
# ==========================

jwt.secret=${JWT_SECRET:TroFinderSecretKey2026SpringBootJWTAuthenticationSecureKey123456789}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
# ==========================
# File Upload
# ==========================

file.upload-dir=uploads
# Giới hạn upload
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==========================
# AI Assistant (Google Gemini)
# ==========================
trofinder.ai.gemini.api-key=${GEMINI_API_KEY:}
trofinder.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
